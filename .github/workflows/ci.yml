name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Test Suite & Schema Verification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check ffmpeg availability
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then echo "ffmpeg available"; else echo "ffmpeg unavailable; media test will skip"; fi
      - name: Run skill regression tests
        shell: bash
        run: |
          python make-editorial-explainer/scripts/test_tools.py -v

      - name: Validate project schema
        run: |
          python3 make-editorial-explainer/scripts/check_schema.py make-editorial-explainer/examples/pilot.project.json
